<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Projekte · Plan B</title>
  <link rel="icon" type="image/svg+xml" href="../../icons/plan-b.svg?v=31">
  <link rel="shortcut icon" href="../../icons/plan-b.svg?v=31">
  <link rel="stylesheet" href="../CSS/projects.css?v=37">
</head>
<body>
  <!-- Kopfzeile wie in den Wireframes (KI-Log Nr. 38) -->
  <header class="topbar">
    <a class="logo" href="../../Home/HTML/index.html" aria-label="Plan B Startseite">
      <img src="../../icons/plan-b.svg?v=31" alt="" aria-hidden="true">
    </a>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="../../Home/HTML/index.html">Home</a>
      <a href="projects.html" aria-current="page">Projekte</a>
      <a href="../../Kalender/HTML/calender.html">Kalender</a>
    </nav>
    <div class="user-area">
      <span class="user-name" id="currentUserName"></span>
      <button class="btn" type="button" id="logoutButton">Abmelden</button>
    </div>
  </header>

  <!-- KI-Log Nr. 31: Projektübersicht "Meine Projekte" + "Neues Projekt anlegen" -->
  <main class="page">
    <section class="projects-col" aria-labelledby="projectsTitle">
      <h1 id="projectsTitle">Meine Projekte</h1>
      
      <div id="projectList"><p class="loading">Projekte werden geladen …</p></div>
      <button class="btn btn-dashed btn-lg btn-block" type="button" id="newProjectButton">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Neues Projekt anlegen
      </button>
    </section>
  </main>

  
  <div class="modal-backdrop" id="newProjectModal" hidden>
    <form class="modal" id="newProjectForm" role="dialog" aria-modal="true" aria-labelledby="newProjectTitle" novalidate>
      <div class="modal-head">
        <h2 id="newProjectTitle">Neues Projekt anlegen</h2>
        <button class="modal-close" type="button" data-close aria-label="Schließen">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="projectTitle">Titel *</label>
          <input class="input" id="projectTitle" name="title" type="text" maxlength="100" required autofocus>
        </div>
        <div class="field">
          <label for="projectDescription">Beschreibung</label>
          <textarea class="textarea" id="projectDescription" name="description" maxlength="500"></textarea>
        </div>
        <p class="form-hint">Du wirst automatisch Projektleitung dieses Projekts.</p>
      </div>
      <div class="modal-foot no-border">
        <button class="btn btn-lg" type="button" data-close>Abbrechen</button>
        <button class="btn btn-primary btn-lg" type="submit" id="createProjectSubmit">Anlegen</button>
      </div>
    </form>
  </div>

  <script src="/Projekte/JS/offline-db.js" defer></script>
  <script src="../JS/api.js" defer></script>
  <script src="../JS/ui.js" defer></script>
  <script src="../JS/projects.js" defer></script>
</body>
</html>
