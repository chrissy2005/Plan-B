<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Kalender</title>
    <link rel="stylesheet" href="../../Projekte/CSS/projects.css">
    <link rel="stylesheet" href="../CSS/calendar.css">
    <script id="googleIdentityScript" src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../../Home/JS/menu.js" defer></script>
    <script src="../JS/calendar.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="/Home/HTML/index.html" aria-label="Plan B Startseite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V3h11l-3 4 3 4H6"/></svg>
        </a>
        <nav class="nav" aria-label="Hauptnavigation">
            <a href="/Home/HTML/index.html">Home</a>
            <a href="/Projekte/HTML/projects.html">Projekte</a>
            <a href="/Benutzer/HTML/user.html">Benutzer</a>
            <a href="/Kalender/HTML/calender.html" aria-current="page">Kalender</a>
            <a href="/Einladungen/HTML/invitations.html">Einladungen <span class="badge" id="invitationBadge" hidden></span></a>
        </nav>
        <div class="user-area">
            <span class="user-name" id="currentUserName"></span>
            <button class="btn" type="button" id="logoutButton" onclick="logout()">Abmelden</button>
        </div>
    </header>

    <main class="page calendar-page">
        <div class="page-head">
            <div>
                <h1>Google Kalender</h1>
                <p class="description">
                    Termine direkt aus deinem Google Kalender laden und neue Termine anlegen.
                </p>
            </div>
        </div>

        <section class="card calendar-connection">
            <h2>Verbindung</h2>
            <p id="calendarConnectionStatus" role="status">
                Google-Anmeldung wird vorbereitet …
            </p>
            <button id="googleConnect" class="btn btn-primary" type="button">
                Mit Google Kalender verbinden
            </button>
            <button id="googleDisconnect" class="btn" type="button" hidden>
                Verbindung trennen
            </button>
        </section>

        <div id="calendarMessage" class="page-message" role="alert" hidden></div>

        <section class="card">
            <div class="section-head">
                <h2>Termine</h2>
                <button id="reloadCalendar" class="btn" type="button" disabled>
                    Aktualisieren
                </button>
            </div>
            <div class="table-wrap">
                <table class="data">
                    <thead>
                        <tr>
                            <th>Termin</th>
                            <th>Beginn</th>
                            <th>Ende</th>
                            <th>Ort</th>
                        </tr>
                    </thead>
                    <tbody id="googleEventsBody">
                        <tr><td colspan="4" class="empty">Bitte zuerst Google verbinden.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <h2>Google-Termin erstellen</h2>
            <form id="googleEventForm" class="calendar-form">
                <label>
                    Titel
                    <input id="eventTitle" class="input" type="text" required maxlength="200">
                </label>
                <label>
                    Beginn
                    <input id="eventStart" class="input" type="datetime-local" required>
                </label>
                <label>
                    Ende
                    <input id="eventEnd" class="input" type="datetime-local" required>
                </label>
                <label>
                    Ort
                    <input id="eventLocation" class="input" type="text" maxlength="200">
                </label>
                <label>
                    Beschreibung
                    <textarea id="eventDescription" class="input" rows="3" maxlength="2000"></textarea>
                </label>
                <button class="btn btn-primary" type="submit" disabled id="createGoogleEvent">
                    Termin in Google Kalender speichern
                </button>
            </form>
        </section>
    </main>
</body>
</html>
